[project]
name = "arco-ia"
version = "0.1.0"
description = "Funções com modelo de linguagem do ARCO: extração de equipamento e relatório da simulação."
requires-python = ">=3.14"
dependencies = [
    "arco-motor",
    "pydantic>=2.13",
    "google-genai>=1.0",
    "pydantic-settings>=2.15",
    "tenacity>=9.1",
    "opentelemetry-api>=1.30",
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
