# Build do AWS Amplify para a interface. Com este arquivo na raiz, o Amplify ignora o build
# spec salvo no console.
#
# O app está configurado como monorepo com a pasta web, então o formato é o de lista de
# `applications`: `appRoot` precisa ser igual à variável AMPLIFY_MONOREPO_APP_ROOT que o
# console define, os comandos rodam de dentro de web/ e `baseDirectory` é relativo a ela.
#
# A imagem de build não traz pnpm; sem instalar, `pnpm install` falha com exit code 127.
# Node e pnpm ficam nas mesmas versões da CI (.github/workflows/ci.yml) e do campo
# packageManager de web/package.json.
version: 1
applications:
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 22 || nvm install 22
            - npm install --global pnpm@9.15.9
            - pnpm install --frozen-lockfile
        build:
          commands:
            - pnpm build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          # Só o store do pnpm: o node_modules é remontado dele em segundos.
          - $HOME/.local/share/pnpm/store/**/*
