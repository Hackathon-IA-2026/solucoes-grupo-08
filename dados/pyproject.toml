[project]
name = "arco-dados"
version = "0.1.0"
description = "Ingestão dos dados abertos do ONS, snapshots e base derivada do ARCO."
requires-python = ">=3.14"
dependencies = [
  "arco-motor",
  "httpx>=0.28",
  "pydantic>=2.13",
  "pydantic-settings>=2.12",
  "typer>=0.27",
  "duckdb>=1.5",
  "pyarrow>=25",
]

[project.scripts]
arco-dados = "arco_dados.cli:app"

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"
