# Alembic do ARCO. A URL real vem de DATABASE_URL, em env.py; o valor aqui é só o padrão.
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
sqlalchemy.url = postgresql+psycopg://arco:arco@localhost:5432/arco

[loggers]
keys = root,sqlalchemy,alembic
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARNING
handlers = console
qualname =
[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine
[logger_alembic]
level = INFO
handlers =
qualname = alembic
[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
